name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH with no leading zeroes: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          project_version="$(dotnet msbuild src/Paperq/Paperq.csproj --nologo -getProperty:Version)"
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match project version $project_version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            executable: paperq.exe
            archive: zip
          - os: ubuntu-24.04
            rid: linux-x64
            executable: paperq
            archive: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            executable: paperq
            archive: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: Restore
        run: dotnet restore paperq.slnx

      - name: Build
        run: dotnet build paperq.slnx --configuration Release --no-restore

      - name: Run test harness
        run: dotnet run --project tests/Paperq.Tests/Paperq.Tests.csproj --configuration Release --no-build

      - name: Publish Native AOT
        run: >-
          dotnet publish src/Paperq/Paperq.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output artifacts/${{ matrix.rid }}
          -p:Version=${{ needs.validate.outputs.version }}
          -p:DebugSymbols=false
          -p:DebugType=None

      - name: Smoke-test published executable
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Published executable not found: $executable"
          }

          $actual = (& $executable --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Published executable returned exit code $LASTEXITCODE."
          }

          $expected = "paperq ${{ needs.validate.outputs.version }}"
          if ($actual -ne $expected) {
            throw "Expected '$expected' but received '$actual'."
          }

      - name: Package release asset
        id: package
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $source = Join-Path $PWD "artifacts/$rid/${{ matrix.executable }}"
          $releaseDirectory = Join-Path $PWD "release"
          $stagingDirectory = Join-Path $env:RUNNER_TEMP "paperq-package-$rid"

          New-Item -ItemType Directory -Path $releaseDirectory | Out-Null
          New-Item -ItemType Directory -Path $stagingDirectory | Out-Null

          if ("${{ matrix.archive }}" -eq "zip") {
            $assetName = "paperq-$version-$rid.zip"
            $stagedExecutable = Join-Path $stagingDirectory "paperq.exe"
            Copy-Item -LiteralPath $source -Destination $stagedExecutable
            Compress-Archive -LiteralPath $stagedExecutable -DestinationPath (Join-Path $releaseDirectory $assetName)
          }
          else {
            $assetName = "paperq-$version-$rid.tar.gz"
            $stagedExecutable = Join-Path $stagingDirectory "paperq"
            Copy-Item -LiteralPath $source -Destination $stagedExecutable
            & chmod '+x' $stagedExecutable
            if ($LASTEXITCODE -ne 0) {
              throw "chmod failed with exit code $LASTEXITCODE."
            }

            & tar '-C' $stagingDirectory '-czf' (Join-Path $releaseDirectory $assetName) 'paperq'
            if ($LASTEXITCODE -ne 0) {
              throw "tar failed with exit code $LASTEXITCODE."
            }
          }

          "asset-path=release/$assetName" >> $env:GITHUB_OUTPUT

      - name: Attest release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.asset-path }}

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: ${{ steps.package.outputs.asset-path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | Where-Object Name -Like 'paperq-*' | Sort-Object Name)
          if ($assets.Count -ne 3) {
            throw "Expected three release archives but found $($assets.Count)."
          }

          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }

          $checksumPath = Join-Path $PWD 'release/SHA256SUMS'
          [System.IO.File]::WriteAllLines($checksumPath, $lines, [System.Text.UTF8Encoding]::new($false))

      - name: Attest checksum file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --title "paperq $VERSION"
