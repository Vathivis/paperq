name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            rid: win-x64
            executable: paperq.exe
          - name: Linux x64
            os: ubuntu-24.04
            rid: linux-x64
            executable: paperq
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            rid: linux-arm64
            executable: paperq

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: Restore
        run: dotnet restore paperq.slnx

      - name: Build
        run: dotnet build paperq.slnx --configuration Release --no-restore

      - name: Run test harness
        run: dotnet run --project tests/Paperq.Tests/Paperq.Tests.csproj --configuration Release --no-build

      - name: Publish Native AOT
        run: >-
          dotnet publish src/Paperq/Paperq.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output artifacts/${{ matrix.rid }}

      - name: Smoke-test published executable
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "artifacts/${{ matrix.rid }}/${{ matrix.executable }}"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Published executable not found: $executable"
          }

          $projectVersion = dotnet msbuild src/Paperq/Paperq.csproj --nologo -getProperty:Version
          $actual = (& $executable --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Published executable returned exit code $LASTEXITCODE."
          }

          $expected = "paperq $projectVersion"
          if ($actual -ne $expected) {
            throw "Expected '$expected' but received '$actual'."
          }
